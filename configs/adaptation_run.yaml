- {model: wav2vec2_large_robust, policy: last4}
- {model: wavlm_base_plus, policy: last2}
- {model: wavlm_base_plus, policy: last4}
- {model: wavlm_large, policy: last2}
- {model: wavlm_large, policy: last4}
